name: Build unsigned FlexGram IPA

on:
workflow_dispatch:

jobs:
build:
runs-on: macos-15
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Check project
    run: xcodebuild -list -project FlexGram.xcodeproj

  - name: Build
    run: |
      xcodebuild \
        -project FlexGram.xcodeproj \
        -scheme FlexGram \
        -configuration Release \
        -sdk iphoneos \
        -derivedDataPath build \
        CODE_SIGNING_ALLOWED=NO \
        build

  - name: Package IPA
    run: |
      mkdir -p Payload
      cp -R build/Build/Products/Release-iphoneos/FlexGram.app Payload/
      zip -r FlexGram-unsigned.ipa Payload

  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: FlexGram-unsigned-IPA
      path: FlexGram-unsigned.ipa
