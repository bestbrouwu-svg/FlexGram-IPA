name: Build unsigned FlexGram IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS device (unsigned)
        run: |
          xcodebuild -project FlexGram.xcodeproj \
            -scheme FlexGram \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/FlexGram.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/FlexGram.app
          /usr/bin/zip -r FlexGram-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FlexGram-unsigned-IPA
          path: FlexGram-unsigned.ipa
          if-no-files-found: error
